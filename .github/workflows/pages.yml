name: Deploy Hugo site with LaTeX notes to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # 1. 用 TeX Live 官方镜像编译 latex/<slug>/main.tex -> latex-out/
  notes:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Compile LaTeX notes
        run: node scripts/latex/compile.mjs

      - name: Upload compiled notes
        uses: actions/upload-artifact@v4
        with:
          name: latex-out
          path: latex-out

  # 2. KaTeX 渲染 + Hugo 构建 + Pagefind 索引 + 部署
  build:
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download compiled notes
        uses: actions/download-artifact@v4
        with:
          name: latex-out
          path: latex-out

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render notes into Hugo content
        run: node scripts/latex/postprocess.mjs

      - name: Setup Hugo
        run: |
          curl --fail --silent --location --remote-name "https://github.com/gohugoio/hugo/releases/download/v0.162.0/hugo_extended_0.162.0_linux-amd64.tar.gz"
          sudo tar -C /usr/local/bin -xf hugo_extended_0.162.0_linux-amd64.tar.gz hugo

      - name: Build site
        run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build search index
        run: npx -y pagefind@1.6.0 --site public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
