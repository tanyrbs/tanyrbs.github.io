<!doctype html>
<html lang="{{ site.Language.Lang }}">
  {{ partial "head.html" . }}
  <body>
    <header class="mobile-header">
      <a class="mobile-brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-sidebar">
        {{ i18n "menu" }}
      </button>
    </header>
    <div class="site-layout">
      <aside class="site-sidebar" id="site-sidebar">
        <div class="sidebar-content">
          <a class="brand" href="{{ site.Home.RelPermalink }}">
            <span class="brand-title">{{ site.Title }}</span>
            <span class="brand-description">{{ site.Params.description }}</span>
          </a>
          {{ partial "nav.html" . }}
          {{ partial "profile.html" . }}
          <div class="sidebar-controls">
            <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">{{ i18n "darkMode" }}</button>
          </div>
        </div>
      </aside>
      <main class="site-main" id="main-content">
        {{ block "main" . }}{{ end }}
      </main>
      {{ if not .IsHome }}
      <aside class="site-rail" aria-label="{{ i18n "siteInformation" }}">
        {{ partial "right-rail.html" . }}
      </aside>
      {{ end }}
      {{ partial "footer.html" . }}
    </div>
  </body>
</html>
