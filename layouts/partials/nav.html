<nav class="site-nav" aria-label="{{ i18n "siteNavigation" }}">
  <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ i18n "home" }}</a>
  {{ with site.GetPage "/articles" }}
    <a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ i18n "articles" }}</a>
  {{ end }}
  {{ with site.GetPage "/archives" }}
    <a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ i18n "archives" }}</a>
  {{ end }}
  <a href="{{ "categories/" | relLangURL }}"{{ if or (in .RelPermalink "/categories/") (and (eq .Kind "term") (eq .Data.Plural "categories")) }} aria-current="page"{{ end }}>{{ i18n "categories" }}</a>
</nav>
