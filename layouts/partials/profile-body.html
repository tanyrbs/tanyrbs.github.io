<img class="avatar" src="{{ site.Params.avatar | relURL }}" width="300" height="273" alt="{{ site.Params.author }}">
<p class="profile-name">{{ site.Params.author }}</p>
<p class="profile-affiliation">
  <span>{{ site.Params.affiliation }}</span>
  <span>{{ site.Params.affiliationSecondary }}</span>
</p>
<div class="profile-icons">
  {{ with site.Params.email }}
    <a class="profile-icon" href="mailto:{{ . }}" title="{{ i18n "email" }}" aria-label="{{ i18n "email" }}">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false">
        <rect x="3" y="5.5" width="18" height="13" rx="2.5"/>
        <path d="M3.6 7.2 12 13l8.4-5.8" stroke-linecap="round"/>
      </svg>
    </a>
  {{ end }}
  {{ with site.Params.github }}
    <a class="profile-icon" href="{{ . }}" rel="me" title="GitHub" aria-label="GitHub">
      <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
    </a>
  {{ end }}
  {{ with site.Params.wechat }}
    <a class="profile-icon" href="{{ . }}" rel="me" title="{{ i18n "wechat" }}" aria-label="{{ i18n "wechat" }}">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false">
        <path d="M9.5 4.5c-3.6 0-6.5 2.2-6.5 5 0 1.6.9 3 2.3 3.9L4.8 16l2.7-1.4c.6.1 1.3.2 2 .2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21.5 14.2c0-2.6-2.5-4.7-5.6-4.7s-5.6 2.1-5.6 4.7 2.5 4.7 5.6 4.7c.7 0 1.3-.1 1.9-.2l2.3 1.2-.4-2.2c1.1-.9 1.8-2.1 1.8-3.5Z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  {{ end }}
</div>
