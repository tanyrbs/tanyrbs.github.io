baseURL = "https://tanyrbs.github.io/"
enableGitInfo = true
titleCaseStyle = "none"
title = "Converging"
copyright = "(c) 2026 THT"
enableRobotsTXT = true
timeZone = "Asia/Shanghai"
summaryLength = 28
defaultContentLanguage = "zh-cn"
locale = "zh-CN"

[params]
  # /articles/ 里系列框的显示顺序；没列出的系列按名字排在后面
  seriesOrder = ["强化学习", "verl 框架解析", "LLM基础架构"]
  homeIntro = "记录强化学习、分布式训练框架与大模型基础架构的推导与思考。"
  description = "THT，cuhk_sz，ecust"
  author = "THT"
  tagline = "still converging, writing it down"
  wechat = "https://mp.weixin.qq.com/s/78rQbWsfAbwjaXzEyuk7dw"
  affiliation = "cuhk_sz"
  affiliationSecondary = "ecust"
  email = "226010319@link.cuhk.edu.cn"
  github = "https://github.com/tanyrbs"
  avatar = "/img/avatar.JPG"
  images = ["/img/avatar.JPG"]
  dateFormat = "2006-01-02"
  showReadingTime = true
  showToc = true

  [[params.seriesColors]]
    name = "强化学习"
    color = "#2c5d72"
    soft = "#eaf0f3"
    border = "#c5d6de"

  [[params.seriesColors]]
    name = "verl 框架解析"
    color = "#356654"
    soft = "#ebf2ef"
    border = "#c4dad1"

  [[params.seriesColors]]
    name = "LLM基础架构"
    color = "#644f72"
    soft = "#f1eef4"
    border = "#d5cbd9"

  [params.giscus]
    enabled = false
    repo = "tanyrbs/tanyrbs.github.io"
    repoId = ""
    category = "Announcements"
    categoryId = ""
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "light"
    lang = "zh-CN"

[permalinks]
  [permalinks.page]
    blog = "/blog/:slug/"
    notes = "/notes/:slug/"
  [permalinks.section]
    blog = "/blog/"
    notes = "/notes/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$']]
        inline = [['$', '$']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[frontmatter]
  lastmod = ["lastmod", ":git", ":fileModTime"]