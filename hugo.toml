baseURL = "https://tanyrbs.github.io/"
enableGitInfo = true
titleCaseStyle = "none"
title = "blog的奇幻漂流"
copyright = "(c) 2026 谭浩陶"
enableRobotsTXT = true
timeZone = "Asia/Shanghai"
summaryLength = 28
defaultContentLanguage = "zh-cn"
locale = "zh-CN"

[params]
  # /articles/ 里系列框的显示顺序；没列出的系列按名字排在后面
  seriesOrder = ["强化学习", "verl 框架解析", "LLM基础架构"]
  description = "谭浩陶，香港中文大学（深圳），华东理工大学"
  author = "谭浩陶"
  tagline = "记录学习与生活的一些个人浅显理解"
  wechat = "https://mp.weixin.qq.com/s/78rQbWsfAbwjaXzEyuk7dw"
  affiliation = "香港中文大学（深圳）"
  affiliationSecondary = "华东理工大学"
  email = "226010319@link.cuhk.edu.cn"
  github = "https://github.com/tanyrbs"
  avatar = "/img/avatar.JPG"
  images = ["/img/avatar.JPG"]
  dateFormat = "2006-01-02"
  showReadingTime = true
  showToc = true

  [params.giscus]
    enabled = false
    repo = "tanyrbs/tanyrbs.github.io"
    repoId = ""
    category = "Announcements"
    categoryId = ""
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "light"
    lang = "zh-CN"

[permalinks]
  [permalinks.page]
    blog = "/blog/:slug/"
    notes = "/notes/:slug/"
  [permalinks.section]
    blog = "/blog/"
    notes = "/notes/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$']]
        inline = [['$', '$']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[frontmatter]
  lastmod = ["lastmod", ":git", ":fileModTime"]